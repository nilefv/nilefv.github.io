<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabell med 3718 rutor och kryssrutor</title>
    <style>
        /* Styla hela tabellen */
        table {
            border-collapse: collapse;
            width: 100%;
        }

        /* Styla varje cell i tabellen */
        td {
            width: 1cm;
            height: 1cm;
            border: 1px solid black;
            text-align: center;
            vertical-align: middle;
        }

        /* Styla kryssrutorna */
        input[type="checkbox"] {
            transform: scale(0.8); /* Gör kryssrutorna lite mindre */
        }
    </style>
</head>
<body>

    <table id="myTable"></table>

    <script>
        // Variabel för antalet rutor
        const totalCells = 3718;
        const rows = 58;  // Antal rader
        const cols = 64;  // Antal kolumner

        // Skapa tabellen
        function createTable() {
            let table = document.getElementById('myTable');
            
            // Skapa rader och celler
            for (let i = 0; i < rows; i++) {
                let row = table.insertRow(i);
                
                for (let j = 0; j < cols; j++) {
                    let cell = row.insertCell(j);
                    let checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    cell.appendChild(checkbox);
                }
            }
        }

        // Anropa funktionen för att skapa tabellen
        createTable();
    </script>
</body>
</html>
